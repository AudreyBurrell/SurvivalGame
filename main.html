<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bronze Age Game</title>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        <div id="headerArea">
            <div id="statsArea">
                <!--put stats and stuff in here after I determine what should be shown-->
                <div id="survivalStats" class="hudGroup">
                    <div class="statChip">🌤️ <span id="weatherDisplay"></span></div>
                    <div class="statChip">👤 <span id="populationDisplay"></span></div>
                    <div class="statChip">🏚️ <span id="homelessDisplay"></span></div>
                    <div class="statChip">❤️ <span id="healthDisplay"></span></div>
                    <div class="statChip">🙂 <span id="happinessDisplay"></span></div>
                    <div class="statChip">🛡️ <span id="strengthDisplay"></span></div>
                    <div class="statChip">⚠️ <span id="dangerDisplay"></span></div>
                </div>
                <div id="resourceStats" class="hudGroup">
                    <div class="statChip">🍖 <span id="foodDisplay"></span></div>
                    <div class="statChip">🪵 <span id="woodDisplay"></span></div>
                    <div class="statChip">🪨 <span id="stoneDisplay"></span></div>
                </div>
            </div>
            <div id="headerControls">
                <button id="nextDayBtn">Next Day</button> 
                <button id="settingsBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" id="gearSVG">
                        <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.63l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.1 7.1 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.57.23-1.11.54-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.85a.5.5 0 0 0 .12.63l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.63l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.4 1.04.72 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.57-.23 1.11-.54 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.63l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div id="gameArea">
            <img src="assets/Background.png" alt="grassy background image" id="gameBg">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="buildMenu">
            <button id="buildToggleBtn" class="circleBtn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M12 8l-6 6h12z"/>
                </svg>
            </button>
            <!--hidden menu (eventually replace these with images)-->
            <div id="buildOptions" class="hidden">
                <button id="placeHouseBtn">House (10 wood + 10 stone)</button>
                <button id="placeFarmBtn">Farm (10 wood + 10 stone + 10 food)</button>
                <button id="placeWoodBtn">Wood Center (20 wood + 10 stone)</button>
                <button id="placeStoneBtn">Stone Center (10 wood + 20 stone)</button>
                <button id="placeFortBtn">Fortification (25 wood + 25 stone)</button>
            </div>
        </div>
        <!--all the popups should go down here.-->
        <div id="screenOverlay"></div>
        <div id="tutorialPopup">
            <p>Welcome to <b>Survival Game</b></p>
            <button id="continueTutorialBtn">View Tutorial</button>
            <button id="leaveTutorialBtn">Skip Tutorial</button>
        </div>
        <!--all the tutorial popups-->
        <div id="tutorialInstructionPopup">
            <p id="arrowText">&uarr;</p>
            <h2 id="tutorialLocationText">Header</h2>
            <p id="tutorialText">This is your resource bar. It shows food, stone, population, etc. Keep track of it to make sure your civilization stays safe.</p>
            <button id="nextTutorialStep">Next</button>
        </div>



        <div id="settingsPopup">
            <!--this is the area where the users can adjust how many people work where-->
            <p id="settingsTitle">Game Settings</p>
            <p id="populationSettingsDisplay"></p>
            <div class="settingsOption">
                <button id="minusFarmer"> - </button>
                <p id="farmerWorkersAmount"></p>
                <button id="plusFarmer"> + </button>
            </div>
            <div class="settingsOption">
                <button id="minusWood"> - </button>
                <p id="woodWorkersAmount"></p>
                <button id="plusWood"> + </button>
            </div>
            <div class="settingsOption">
                <button id="minusStone"> - </button>
                <p id="stoneWorkersAmount"></p>
                <button id="plusStone"> + </button>
            </div>
            <div class="settingsOption">
                <button id="minusWarrior"> - </button>
                <p id="warriorWorkersAmount"></p>
                <button id="plusWarrior"> + </button>
            </div>
            <div class="settingsOption">
                <label for="rationSelect">Rations</label>
                <select id="rationSelect">
                    <option value="low">Low</option>
                    <option value="normal" selected>Normal</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="settingsOption">
                <label for="productionSelect">Production Pace</label>
                <select id="productionSelect">
                    <option value="slow">Slow</option>
                    <option value="normal" selected>Normal</option>
                    <option value="high">High</option>
                </select>
            </div>
            <button id="leaveSettingsBtn">Exit</button>
        </div>

    </body>
    <script type="module" src="js/main.js"></script>

</html>
